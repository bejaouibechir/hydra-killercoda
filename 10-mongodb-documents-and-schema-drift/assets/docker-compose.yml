name: hydra-lab10
services:
  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
volumes:
  mongo-data:
